services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: applyforge
      POSTGRES_PASSWORD: applyforge
      POSTGRES_DB: applyforge
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    env_file: ../apps/api/.env.example
    volumes: ["../apps/api:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    env_file: ../apps/worker/.env.example
    volumes: ["../apps/worker:/app"]
    depends_on: [api, redis, db]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    env_file: ../apps/web/.env.example
    volumes: ["../apps/web:/app"]
    ports: ["3000:3000"]
    depends_on: [api]

  flower:
    image: mher/flower
    command: celery --broker=redis://redis:6379/0 flower
    ports: ["5555:5555"]
    depends_on: [redis]

volumes:
  pg_data:
